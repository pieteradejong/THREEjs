name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  # The same named steps as a local ./test.sh. --ci skips the browser render step and the gate
  # (the gate runs in security.yml). Nothing here touches a Pi: run.sh's ssh is a stub.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test suite
        run: ./test.sh --ci
